name: Migration checks

on:
  pull_request:
    paths:
      - 'spring-app/**'
      - '.github/workflows/migration-checks.yml'
  push:
    branches:
      - main

jobs:
  flyway-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x spring-app/mvnw

      - name: Validate migrations (CI preflight)
        working-directory: spring-app
        env:
          FLYWAY_URL: jdbc:h2:mem:migration_check;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
          FLYWAY_USER: sa
          FLYWAY_PASSWORD: ""
        run: |
          ./scripts/deployment-preflight.sh
